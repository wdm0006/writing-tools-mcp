[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "writing-tools-mcp"
version = "0.0.6"
description = "MCP server for advanced text analysis, optimized for Claude Desktop."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
   { name="Will McGinnis", email="will@mcginniscommawill.com" },
]

dependencies = [
    "fastmcp>=3.4.5,<4.0.0",
    "pyspellchecker",
    "textstat",
    "wordfreq",
    "spacy",
    "markdown-it-py",
    "requests",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "packaging",
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "mypy",
    "types-PyYAML",
    "pre-commit",
    "tomli; python_version < '3.11'",
]

[project.urls]
"Homepage" = "https://github.com/wdm0006/writing-tools-mcp" 
"Bug Tracker" = "https://github.com/wdm0006/writing-tools-mcp/issues" 

# Example for ruff (linter) configuration
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Complexity waivers, registered in docs/mutation-waivers.md: the 735-line
# stylometry analyzer is deliberately not refactored in this pass, and these
# sites keep their pre-existing shape rather than being restructured now.
"server/stylometry/analyzer.py" = ["C901"]
"server/analyzers/ai_detection.py" = ["C901"]
"server/stylometry/corpus_baseline.py" = ["C901"]
"server/stylometry/statistical.py" = ["C901"]
"server/text_processing/markdown_parser.py" = ["C901"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
files = ["server"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# textstat ships no py.typed marker or stubs; its API is exercised by tests.
module = "textstat"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make the repo root importable so tests can reach the benchmarks package
# without depending on editable-install side effects.
pythonpath = ["."]
# Hard stop for pathological mutants during mutation testing; the slowest
# legitimate test finishes in seconds (spaCy model load is session-scoped).
timeout = 60

[tool.mutmut]
# The whole server package is copied into the mutation shadow tree so imports
# keep resolving; do_not_mutate keeps the torch-loading paths out of scope.
# The tests anchor several checks on the repo root (the shadow-tree root), so
# every root file they read must ride along unchanged.
source_paths = ["server"]
also_copy = ["benchmarks", "scripts", ".mcp-config.yaml", "pyproject.toml", "manifest.json", "run_server.py"]
do_not_mutate = ["server/models/*", "server/analyzers/ai_detection.py"]
# The subprocess test in test_logging_config.py launches `python -c` with a
# tmp_path cwd; importing the shadow server package pulls in mutmut's
# trampoline, which requires a resolvable mutmut config at import time —
# impossible from that cwd. The in-process logging tests still cover the
# same bootstrap/configure_logging mutants, so deselect it for mutant runs.
pytest_add_cli_args = [
    "--deselect", "tests/test_logging_config.py::TestServerStartup::test_loader_warnings_are_visible_and_stdout_stays_clean",
]

[tool.hatch.build.targets.wheel]
packages = ["server"]

[project.scripts]
writing-tools-mcp = "server.app:main"
