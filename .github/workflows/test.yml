name: Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify uv installation
        run: uv --version

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Install spaCy model (GitHub-hosted wheel; not on PyPI)
        run: uv pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl

      - name: Run linter
        run: uv run ruff check .

      - name: Run formatter check
        run: uv run ruff format --check .

      - name: Run type checker
        run: uv run mypy

      - name: Run tests with coverage gate
        run: uv run pytest tests/ --cov=server --cov-report=term-missing --cov-fail-under=90 -v

      - name: Test entry point resolves
        run: |
          uv run python -c "import importlib.util; spec = importlib.util.find_spec('server.app'); assert spec and spec.origin and spec.origin.endswith('app.py'), spec; from server.app import main; assert callable(main); print('Entry point server.app:main resolves')"

  calibration-drift:
    # The published docs/calibration.md is derived from the committed benchmark
    # scores. This job regenerates it and fails when the committed table no
    # longer matches, so any threshold change must re-derive the published
    # numbers. Deliberately dependency-light: the generator is stdlib-only.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Regenerate the calibration table and fail on drift
        run: python benchmarks/calibrate_detection.py --check

      - name: Calibration generator tests
        # --noconftest: the shared tests/conftest.py imports the server package
        # (numpy, spaCy, torch), which this dependency-light job deliberately
        # does not install. The calibration tests are self-contained.
        run: pytest tests/test_calibration.py -v --noconftest
